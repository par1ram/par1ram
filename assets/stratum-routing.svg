<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img" aria-labelledby="title desc">
  <title id="title">Vladislav’s Stratum relay</title>
  <desc id="desc">A direct ASIC and a mining proxy forward shares on separate sessions. The proxy aggregates shares from several ASICs. The relay streams telemetry to a hashrate balancer over bidirectional gRPC. The balancer smooths hashrate with an EWMA. When pool A goes offline, the breaker trips and the balancer tells the relay to move the ASIC onto an already-open connection to pool B. The proxy stays on its own connection to B.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2b423b"/></pattern>
    <clipPath id="scope-window"><rect x="5" y="6" width="33" height="31" rx="2"/></clipPath>
    <g id="fan">
      <circle r="8.4" fill="#15241d" stroke="#acc997" stroke-width="1.3"/>
      <g class="rotor" fill="#a6c391">
        <path id="blade" d="M1-2Q0-8 5-6Q7-3 2 0Z"/>
        <use href="#blade" transform="rotate(90)"/><use href="#blade" transform="rotate(180)"/><use href="#blade" transform="rotate(270)"/>
      </g>
      <circle r="2" fill="#e4eacd"/>
    </g>
    <g id="miner" stroke-linejoin="round">
      <path d="m0 9 16-8h50L50 9z" fill="#59735f" stroke="#a0b399"/>
      <path d="m50 9 16-8v25l-16 8z" fill="#2c4939" stroke="#96b29a"/>
      <rect y="9" width="50" height="25" rx="2" fill="#334b3a" stroke="#a7bf9c"/>
      <path d="m11 7 9-4m0 4 9-4m0 4 9-4m0 4 9-4m7 11 9-5m-9 10 9-5m-9 10 9-5" fill="none" stroke="#b6c5a5" stroke-width="1.3"/>
      <use href="#fan" x="13" y="21.5"/><use href="#fan" x="36" y="21.5"/>
    </g>
    <g id="proxy-source">
      <rect width="14" height="8" rx="2" fill="#2b4636" stroke="#a4ba9e"/>
      <circle cx="4.5" cy="4" r="1.7" fill="none" stroke="#c2d2b3"/>
      <path d="M8 4h3" stroke="#81ba8d" stroke-width="1.5"/>
    </g>
    <g id="proxy" stroke-linejoin="round">
      <g fill="none" stroke="#648e76" stroke-width="2">
        <path id="feed-top" pathLength="40" d="M13 4h5l12 12h12"/>
        <path id="feed-mid" pathLength="40" d="M13 16h29"/>
        <path id="feed-low" pathLength="40" d="M13 28h5l12-12h12"/>
      </g>
      <g fill="none" stroke="#a4ffcd" stroke-width="3" stroke-linecap="round">
        <use href="#feed-top" class="feed"/><use href="#feed-mid" class="feed" style="animation-delay:-0.7s"/>
        <use href="#feed-low" class="feed" style="animation-delay:-1.4s"/>
      </g>
      <use href="#proxy-source"/><use href="#proxy-source" y="12"/><use href="#proxy-source" y="24"/>
      <path d="m38 7 6-4h18l-5 4z" fill="#67846a" stroke="#b1c5a8"/>
      <path d="m57 7 5-4v22l-5 4z" fill="#294437" stroke="#94ad94"/>
      <rect x="38" y="7" width="19" height="22" rx="2" fill="#365441" stroke="#adc2a6"/>
      <path d="M42 12h11m-11 3h11" stroke="#92ae91" stroke-width="1.5"/>
      <rect x="42" y="20" width="11" height="5" rx="1" fill="#13271b" stroke="#a0b49a"/>
      <path d="M59 17h9m-3-3 3 3-3 3" fill="none" stroke="#95edb3" stroke-width="2"/>
    </g>
    <g id="rack" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect width="28" height="10" x="0" y="0" rx="2"/><rect width="28" height="10" x="0" y="14" rx="2"/>
      <path d="M4 5h3m6 0h10M4 19h3m6 0h10"/>
    </g>
    <g id="upstream-jack">
      <rect width="21" height="13" rx="2" fill="#0e1b16" stroke="#8fa88d"/>
      <path d="M3 3h15v5h-4v3H7V8H3z" fill="#355443"/>
      <path d="M6 3v3m3-3v3m3-3v3m3-3v3" stroke="#aec0a0" stroke-width="1.2"/>
    </g>
    <g id="port"><circle r="4.2" fill="#11241e" stroke="#96b89d" stroke-width="2"/></g>
    <path id="in1" d="M264 290H357"/><path id="in2" d="M264 360H357"/>
    <path id="toA" d="M598 290H750"/><path id="toB1" d="M598 307H625L661 343H750"/><path id="toB2" d="M598 361H750"/>
    <path id="up" d="M420 256V184"/><path id="down" d="M535 184V256"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#edf3e3 }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace }
    .muted { fill:#a4baab }
    .label { font-size:14px; letter-spacing:1.1px }
    .node { fill:#1a2c25; stroke:#597360; stroke-width:1.5 }
    .wire { fill:none; stroke:#516f58; stroke-width:3; stroke-linejoin:round }
    .packet { fill:none; stroke:#c1ef97; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 85; animation:travel 1.65s linear infinite }
    .proxy-packet { stroke:#80e8b0; stroke-dasharray:8 38; animation-duration:2s; animation-delay:-0.36s }
    .proxy-out { animation-delay:-0.92s }
    .rotor { animation:spin 3s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }
    .feed { stroke-dasharray:3 81; animation:aggregate 2.1s linear infinite }
    @keyframes aggregate { from { stroke-dashoffset:4 } to { stroke-dashoffset:-80 } }
    .scope { animation:scrollTrace 3.8s linear infinite }
    @keyframes scrollTrace { to { transform:translateX(-34px) } }
    .contact { transform-origin:5px 10px; animation:changeRoute 14s linear infinite }
    @keyframes changeRoute {
      0%,44% { transform:rotate(-19deg) }
      47%,54% { transform:rotate(0deg) }
      66%,100% { transform:rotate(19deg) }
    }
    .rx { animation:receive 1.65s linear infinite; animation-delay:-0.56s }
    .rx-proxy { animation-duration:1s; animation-delay:-0.62s }
    @keyframes receive { 0%,100% {opacity:1} 42%,80% {opacity:0.15} }
    .blue { stroke:#68d0d4; animation-duration:1.4s }
    .amber { stroke:#ffb276; animation-duration:1s }
    .lost,.switch,.onB,.outage { opacity:0 }
    .normal { animation:routeAvailable 14s step-end infinite }
    .lost { animation:lost 14s step-end infinite }
    .switch { animation:switch 14s step-end infinite }
    .onB { animation:onB 14s step-end infinite }
    .outage { animation:outage 14s step-end infinite }
    @keyframes travel { to { stroke-dashoffset:-92 } }
    @keyframes routeAvailable { 0%,100% {opacity:1} 44% {opacity:0} }
    @keyframes lost { 0%,54%,100% {opacity:0} 44% {opacity:1} }
    @keyframes switch { 0%,66%,100% {opacity:0} 54% {opacity:1} }
    @keyframes onB { 0%,100% {opacity:0} 66% {opacity:1} }
    @keyframes outage { 0%,100% {opacity:0} 44% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important }
      .contact { transform:rotate(19deg) }
      .normal {opacity:0} .outage,.onB {opacity:1}
    }
  </style>

  <rect x="1" y="1" width="958" height="542" rx="24" fill="#172820" stroke="#496051" stroke-width="2"/>
  <g fill="#ffae71"><path d="M32 29h8v16h8V29h8v16h-8v8h-8v-8h-8z"/></g>
  <text x="72" y="48" class="mono" font-size="19">Vladislav <tspan fill="#a4baab">/ @par1ram</tspan></text>
  <text x="928" y="53" text-anchor="end" font-size="35" font-weight="650" letter-spacing="-1">Stratum relay</text>
  <rect x="19" y="78" width="922" height="358" rx="13" fill="#0e1b16" stroke="#415b4a"/>
  <rect x="20" y="79" width="920" height="356" rx="12" fill="url(#grid)"/>

  <g class="wire">
    <use href="#in1"/><use href="#in2"/><use href="#toA"/><use href="#toB1"/><use href="#toB2"/>
    <use href="#up" stroke="#437878"/><use href="#down" stroke="#926b4d"/>
  </g>
  <use href="#in1" class="packet"/>
  <use href="#in2" class="packet proxy-packet"/>
  <use href="#toB2" class="packet proxy-packet proxy-out"/>
  <g class="normal"><use href="#toA" class="packet"/></g>
  <g class="onB"><use href="#toB1" class="packet"/></g>
  <use href="#up" class="packet blue"/><g class="switch"><use href="#down" class="packet amber"/></g>
  <path d="m415 202 5-7 5 7" fill="none" stroke="#68d0d4" stroke-width="2"/>
  <path d="m530 237 5 7 5-7" fill="none" stroke="#ffb276" stroke-width="2"/>

  <rect x="308" y="100" width="340" height="84" rx="12" class="node"/>
  <g transform="translate(329 119)" fill="none" stroke="#83d8ce" stroke-linejoin="round" stroke-width="2.5">
    <rect width="43" height="43" rx="7" stroke="#46675b"/>
    <g clip-path="url(#scope-window)">
      <path d="M5 15h33M5 28h33" stroke="#38564c" stroke-width="1"/>
      <path class="scope" d="M5 25q4 0 7-6t7-2 7 7 7 1q3 0 6 0q4 0 7-6t7-2 7 7 7 1q3 0 6 0" stroke="#83d8ce"/>
    </g>
  </g>
  <text x="388" y="135" font-size="23" font-weight="650">Hashrate balancer</text>
  <text x="388" y="160" class="muted mono" font-size="15">EWMA · circuit breaker</text>
  <text x="405" y="221" text-anchor="end" class="mono" font-size="16" style="fill:#83dadc">telemetry ↑</text>
  <text x="477" y="222" class="mono" text-anchor="middle" font-size="16">gRPC</text>
  <text x="550" y="221" class="mono" font-size="16" style="fill:#ffb276">↓ move command</text>

  <g class="node">
    <rect x="42" y="260" width="222" height="60" rx="9"/><rect x="42" y="330" width="222" height="60" rx="9"/>
    <rect x="357" y="256" width="241" height="122" rx="12" fill="#22362a" stroke="#829e78"/>
    <rect x="750" y="265" width="165" height="50" rx="9"/><rect x="750" y="326" width="165" height="59" rx="9"/>
  </g>
  <use href="#miner" x="54" y="272"/><use href="#proxy" x="54" y="344"/>
  <text x="130" y="287" font-size="21" font-weight="650">ASIC</text>
  <text x="130" y="307" class="muted" font-size="14">Direct session</text>
  <text x="130" y="357" font-size="20" font-weight="650">Mining proxy</text>
  <text x="130" y="377" class="muted" font-size="14">Aggregated shares</text>
  <g class="mono label muted"><text x="42" y="249">HASHRATE SOURCES</text><text x="750" y="249">UPSTREAM POOLS</text></g>
  <g transform="translate(383 263)" stroke-linejoin="round">
    <path d="m0 6 9-5h66l-8 5z" fill="#667d62" stroke="#adbf9e"/>
    <path d="m67 6 8-5v30l-8 5z" fill="#294434" stroke="#93aa90"/>
    <rect y="6" width="67" height="30" rx="3" fill="#182c20" stroke="#a1b599"/>
    <g transform="translate(14 6)" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M-6 10H5m18-6h20m-20 12h20" stroke="#64816a"/>
      <path d="M5 10h19" class="contact" stroke="#c5ed9f"/>
      <circle cx="5" cy="10" r="2.2" fill="#b9e098"/>
      <path d="M-6 24h49" stroke="#547a62"/>
      <path d="M-6 24h49" class="packet proxy-packet" style="stroke-width:2.5"/>
    </g>
    <g fill="#1f3223" stroke="#899f86">
      <rect x="3" y="14" width="6" height="4" rx="1"/><rect x="3" y="28" width="6" height="4" rx="1"/>
      <rect x="56" y="8" width="7" height="4" rx="1"/><rect x="56" y="20" width="7" height="4" rx="1"/>
      <rect x="56" y="28" width="7" height="4" rx="1" fill="#80e8b0"/>
    </g>
    <rect class="normal" x="57" y="9" width="5" height="2" fill="#c5ed9f"/>
    <rect class="onB" x="57" y="21" width="5" height="2" fill="#c5ed9f"/>
  </g>
  <g transform="translate(480 263)" stroke-linejoin="round">
    <title>Persistent upstream sockets. The ASIC moves from A to a ready socket on B. The proxy keeps its own socket on B.</title>
    <path d="m0 6 8-5h84l-7 5z" fill="#56715c" stroke="#a2b79d"/>
    <path d="m85 6 7-5v29l-7 5z" fill="#2a4536" stroke="#91a98d"/>
    <rect y="6" width="85" height="29" rx="3" fill="#1a2d24" stroke="#a1b599"/>
    <use href="#upstream-jack" x="5" y="9"/><use href="#upstream-jack" x="33" y="9"/>
    <use href="#upstream-jack" x="59" y="9"/>
    <path d="M29 10v21" stroke="#5c735f"/>
    <g class="mono" font-size="9" font-weight="700" text-anchor="middle">
      <text x="9" y="32">A</text><text x="37" y="32">B</text>
    </g>
    <g fill="none" stroke-width="3" stroke-linecap="round">
      <path d="M17 28h5m23 0h6" stroke="#61775f"/>
      <g class="normal"><path d="M17 28h5" stroke="#c5ed9f"/></g>
      <g class="outage"><path d="M17 28h5" stroke="#f19680"/></g>
      <g class="switch"><path d="M45 28h6" stroke="#ffb276"/></g>
      <g class="onB"><path d="M45 28h6" stroke="#c5ed9f"/></g>
      <path d="M68 28h6" stroke="#80e8b0"/>
    </g>
  </g>
  <text x="383" y="325" font-size="26" font-weight="650">Stratum relay</text>
  <text x="383" y="352" class="muted" font-size="17">Persistent connections</text>
  <use href="#rack" x="766" y="278" color="#b5ceab"/><use href="#rack" x="766" y="344" color="#b5ceab"/>
  <g stroke-linecap="round" stroke-width="3.5">
    <g class="normal"><path class="rx" d="M770 283h4" stroke="#c1ef97"/></g>
    <path class="rx rx-proxy" d="M770 363h4" stroke="#80e8b0"/>
    <g class="onB"><path class="rx" d="M770 349h4" stroke="#c1ef97"/></g>
  </g>
  <text x="808" y="297" font-size="21">Pool A</text><text x="808" y="363" font-size="21">Pool B</text>
  <g class="outage">
    <rect x="750" y="265" width="165" height="50" rx="9" fill="none" stroke="#f19680" stroke-width="2"/>
    <path d="m885 285 10 10m0-10-10 10" stroke="#f19680" stroke-width="2.5"/>
    <path d="m688 284-9 12m18-12-9 12" stroke="#f19680" stroke-width="2.5"/>
  </g>
  <g>
    <use href="#port" x="264" y="290"/><use href="#port" x="264" y="360"/>
    <use href="#port" x="357" y="290"/><use href="#port" x="357" y="360"/>
    <use href="#port" x="598" y="290"/><use href="#port" x="598" y="307"/><use href="#port" x="598" y="361"/>
    <use href="#port" x="750" y="290"/><use href="#port" x="750" y="343"/><use href="#port" x="750" y="361"/>
  </g>
  <g class="mono" font-size="16">
    <path d="m43 406 7 6-7 6" fill="none" stroke="#ffb276" stroke-width="2.6"/>
    <text x="64" y="418" class="normal">Forwarding · ASIC → A, proxy → B</text>
    <text x="64" y="418" class="lost" style="fill:#f4aa95">Pool A offline · circuit breaker opens</text>
    <text x="64" y="418" class="switch" style="fill:#ffb276">Move ASIC → B · reuse open connection</text>
    <text x="64" y="418" class="onB">Pool B active · separate ASIC and proxy sessions</text>
    <text x="913" y="418" text-anchor="end" class="muted label">FAILOVER REPLAY</text>
  </g>

  <g stroke="#495f4e"><path d="M297 458v61m349-61v61"/></g>
  <g font-size="29" font-weight="650">
    <text x="42" y="484">5–6 EH/s</text><text x="324" y="484">15 min</text><text x="674" y="484">±10 PH/s</text>
  </g>
  <g class="muted" font-size="17"><text x="42" y="512">Relay throughput</text><text x="324" y="512">Balancing 1 EH/s</text><text x="674" y="512">Deviation from target</text></g>
</svg>
