name: GitHub Profile 3D Contributions

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Generate 3D contribution graph
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Refresh Stratum V2 badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merged_prs="$(gh api --method GET search/issues \
            -f q='repo:stratum-mining/stratum is:pr is:merged author:${{ github.repository_owner }}' \
            --jq '.total_count')"
          sed -i -E "s|(Stratum%20V2-)[0-9]+(%20merged%20PRs)|\1${merged_prs}\2|" README.md
          sed -i -E "s|(Stratum V2 contributor — )[0-9]+( merged pull requests)|\1${merged_prs}\2|" README.md

      - name: Refresh graph cache version
        env:
          CACHE_VERSION: ${{ github.run_id }}
        run: |
          sed -i -E "s|(profile-night-green\.svg)\?v=[0-9]+|\1?v=${CACHE_VERSION}|" README.md

      - name: Commit generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: refresh profile visuals"; then
            git push
          fi
